<main>
  <section class="page-hero compact-page-hero">
    <div class="container page-hero-grid">
      <div><nav class="breadcrumbs" aria-label="Хлебные крошки"><a href="index.html">Главная</a><span>—</span><span>{{page.hero.breadcrumb}}</span></nav><span class="kicker">{{page.hero.kicker}}</span><h1>{{page.hero.heading}}</h1><p class="lead">{{page.hero.lead}}</p></div>
      <aside class="page-hero-note"><strong>{{page.hero.note_title}}</strong><p>{{page.hero.note_text}}</p></aside>
    </div>
  </section>

  <section class="section section-dark portfolio-page-section">
    <div class="container">
      <div class="works-grid">
{{#each page.gallery.items}}
        <article class="work-card" data-carousel><div class="work-media">{{#each images}}<img class="{{active_class}}" src="{{src}}" alt="{{alt}}" data-cms-path="gallery.items[{{@parent_index}}].images[{{@index}}].src">{{/each}}</div><div class="work-body"><h3>{{title}}</h3><p>{{text}}</p><span>{{page.gallery.hint}}</span></div></article>
{{/each}}
      </div>
      <div class="centered-action"><a class="btn btn-primary" href="{{page.cta.url}}">{{page.cta.label}}</a></div>
    </div>
  </section>
</main>
