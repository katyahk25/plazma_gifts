<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ПЛАЗМА — визуальное управление сайтом</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-toolbar">
      <a class="admin-brand" href="../index.html" target="_blank" rel="noopener">ПЛАЗМА</a>
      <label class="page-picker">Страница <select id="page-select"></select></label>
      <span class="branch-pill" id="branch-pill"></span>
      <span class="save-status" id="save-status">Без изменений</span>
      <button class="toolbar-button secondary" id="reload-button" type="button">Сбросить</button>
      <button class="toolbar-button primary" id="save-button" type="button">Сохранить</button>
    </header>

    <main class="admin-workspace">
      <section class="preview-panel">
        <div class="preview-hint">Нажмите на текст или изображение прямо на странице.</div>
        <iframe id="site-preview" title="Предпросмотр сайта"></iframe>
      </section>

      <aside class="editor-panel" id="editor-panel">
        <div class="editor-empty" id="editor-empty">
          <strong>Выберите элемент на сайте</strong>
          <p>Наведи курсор на нужный текст или изображение и нажми на него.</p>
        </div>
        <div class="editor-content" id="editor-content" hidden>
          <div class="editor-eyebrow">Редактирование</div>
          <h2 id="editor-title">Поле</h2>
          <code id="editor-path"></code>
          <div id="candidate-list" class="candidate-list" hidden></div>
          <label class="editor-field">
            <span>Значение</span>
            <textarea id="editor-text" rows="7"></textarea>
          </label>
          <div class="editor-note" id="editor-note"></div>
        </div>
      </aside>
    </main>
  </div>

  <dialog id="password-dialog">
    <form method="dialog" class="login-card" id="password-form">
      <h2>Сохранение в GitHub</h2>
      <p>Введите пароль админки. Он хранится только в текущей вкладке браузера.</p>
      <input id="admin-password" type="password" autocomplete="current-password" required>
      <div class="dialog-actions">
        <button value="cancel" class="toolbar-button secondary">Отмена</button>
        <button value="default" class="toolbar-button primary">Продолжить</button>
      </div>
    </form>
  </dialog>

  <script src="admin.js"></script>
</body>
</html>
